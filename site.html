<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEECH — the open comment layer for the web</title>
<style>
:root { --ink:#111827; --mut:#6b7280; --line:#e5e7eb; --brand:#4f46e5; --bg:#f6f7fb; }
* { box-sizing:border-box; margin:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5; }
header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
.hwrap { max-width:860px; margin:0 auto; padding:13px 20px; display:flex; align-items:center; gap:14px; }
.brand { font-weight:800; letter-spacing:.4px; color:var(--brand); font-size:20px; text-decoration:none; }
.tagline { color:var(--mut); font-size:12px; flex:1; }
.search { position:relative; }
.search input { border:1px solid var(--line); border-radius:999px; padding:8px 14px; font-size:13px; width:210px; outline:none; background:#fff; color:var(--ink); }
.search input:focus { border-color:var(--brand); }
.sres { position:absolute; top:42px; right:0; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.10); width:260px; overflow:hidden; }
.sres a { display:block; padding:10px 14px; text-decoration:none; color:var(--ink); border-bottom:1px solid #f3f4f6; font-size:14px; }
.sres a:last-child { border-bottom:none; }
.sres a:hover { background:#f5f6ff; }
.sres .su { color:var(--mut); font-size:12px; }
main { max-width:860px; margin:0 auto; padding:24px 20px 60px; }
h2 { font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--mut); margin:26px 0 12px; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:15px 18px; margin-bottom:10px; }
a { color:var(--brand); }
.u { font-weight:700; color:var(--ink); text-decoration:none; }
.u:hover { color:var(--brand); }
.meta { color:#9ca3af; font-size:12px; }
.cbody { margin:6px 0; white-space:pre-wrap; word-wrap:break-word; }
.cbody.del { color:#9ca3af; font-style:italic; }
.pl { font-size:12px; color:var(--mut); }
.pl a { text-decoration:none; }
.pl a:hover { text-decoration:underline; }
.score { display:inline-block; background:#eef2ff; color:var(--brand); border-radius:999px; padding:1px 9px; font-size:12px; font-weight:700; margin-right:8px; }
.prof { display:flex; gap:18px; align-items:center; }
.ava { width:74px; height:74px; min-width:74px; border-radius:50%; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; }
.pname { font-size:22px; font-weight:800; }
.puser { color:var(--mut); }
.star { font-size:12px; cursor:default; }
.supchip { display:inline-block; background:#fef3c7; color:#92400e; border:1px solid #fcd34d; border-radius:999px; padding:1px 10px; font-size:12px; font-weight:700; margin-top:6px; }
.bio { margin-top:6px; white-space:pre-wrap; }
.stats { color:var(--mut); font-size:13px; margin-top:6px; }
.reply { margin-left:34px; }
.empty { color:#9ca3af; text-align:center; padding:40px 10px; }
.note { background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:18px; }
footer { max-width:860px; margin:0 auto; padding:0 20px 40px; color:#9ca3af; font-size:12px; text-align:center; }
.crumb { font-size:13px; margin-bottom:14px; }
.crumb a { text-decoration:none; }
.domain { font-size:12px; color:var(--mut); margin-top:2px; }
.pgtitle { font-weight:700; }
.pgtitle a { text-decoration:none; color:var(--ink); }
.pgtitle a:hover { color:var(--brand); }
.hero { text-align:center; padding:34px 0 28px; }
.hero .h1 { font-size:36px; font-weight:800; line-height:1.12; letter-spacing:-.5px; }
.hero .hsub { color:var(--mut); font-size:16px; max-width:560px; margin:14px auto 22px; }
@media (max-width:640px){ .hero .h1{font-size:26px} }
.getbtn { background:var(--brand); color:#fff; border-radius:999px; padding:8px 14px; font-size:13px; font-weight:700; text-decoration:none; white-space:nowrap; }
.getbtn:hover { background:#4338ca; }
.dlbtn { display:inline-block; background:var(--brand); color:#fff; border-radius:10px; padding:12px 22px; font-size:15px; font-weight:700; text-decoration:none; }
.dlbtn:hover { background:#4338ca; }
.legal p { margin:10px 0; }
@media (max-width:640px){ .tagline{display:none} .search input{width:150px} .getbtn{display:none} }
</style>
</head>
<body>
<header><div class="hwrap">
  <a class="brand" href="#/">SPEECH</a>
  <span class="tagline">the open comment layer for the web</span>
  <div class="search">
    <input id="q" placeholder="Find people…" autocomplete="off">
    <div id="sres" class="sres" style="display:none"></div>
  </div>
  <a class="getbtn" href="#/install">Get the extension</a>
</div></header>
<main id="app"></main>
<footer>Reading is open to everyone. Posting, voting, friends &amp; groups happen in the <a href="#/install">SPEECH browser extension</a>. · <a href="#/privacy">Privacy</a></footer>
<script src="site.js"></script>
</body>
</html>
